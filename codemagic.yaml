workflows:
  kolo-ios-android:
    name: KOLO iOS & Android Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: KOLO 1

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: io.kolo.app
      vars:
        PACKAGE_NAME: "io.kolo.app"
        BUNDLE_ID: "io.kolo.app"
        APP_STORE_APPLE_ID: "6761818371"
        # CRITICAL: backed at build time into the React bundle (CRA reads this
        # via process.env.REACT_APP_BACKEND_URL). Points to the STABLE Emergent
        # deployment on the custom domain trykolo.io (same domain serves the
        # marketing site at `/` and the API at `/api/*`).
        REACT_APP_BACKEND_URL: "https://trykolo.io"
      node: 20
      xcode: latest
      cocoapods: default
      java: 17

    triggering:
      events:
        - push
        - pull_request
      # IMPORTANT : on accepte TOUTE branche (y compris `emergent/*` créées par
      # "Save to Github"). Sans ça, Codemagic ne buildait que `main` — qui
      # restait figé à l'ancienne version car "Save to Github" ne pousse pas
      # forcément sur main. Combiné au workflow .github/workflows/mirror-to-main.yml
      # (qui force `main` à chaque push), on garantit que tout push déclenche
      # un build de la BONNE version.
      branch_patterns:
        - pattern: '*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          yarn install --frozen-lockfile || yarn install

      - name: Compute App Store build number
        script: |
          # On calcule AVANT `yarn build` pour l'estampiller dans le JS bundle.
          # Sans ça, le numéro affiché dans l'app ne correspond pas au build
          # TestFlight (Codemagic donne CM_BUILD_NUMBER = son propre compteur
          # interne, mais App Store veut le max entre AppStore et TestFlight
          # + 1).
          APP_STORE_NUM=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          TESTFLIGHT_NUM=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          MAX_NUM=$(( APP_STORE_NUM > TESTFLIGHT_NUM ? APP_STORE_NUM : TESTFLIGHT_NUM ))
          BUILD_NUMBER=$((MAX_NUM + 1))
          echo "App Store latest: $APP_STORE_NUM · TestFlight latest: $TESTFLIGHT_NUM · new: $BUILD_NUMBER"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $CM_ENV
          # Estampille lisible dans l'app : "<build>-<sha7>-<UTC>"
          SHORT_SHA=$(echo "${CM_COMMIT:-nogit}" | cut -c1-7)
          BUILD_STAMP="${BUILD_NUMBER}-${SHORT_SHA}-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "BUILD_STAMP=${BUILD_STAMP}" >> $CM_ENV
          echo "Estampille bundle : ${BUILD_STAMP}"

      - name: Build React app (CI=true, avec estampille)
        script: |
          cd frontend
          export REACT_APP_BACKEND_URL="${REACT_APP_BACKEND_URL:-https://trykolo.io}"
          export REACT_APP_BUILD_ID="${BUILD_STAMP}"
          echo "REACT_APP_BACKEND_URL=$REACT_APP_BACKEND_URL"
          echo "REACT_APP_BUILD_ID=$REACT_APP_BUILD_ID"
          # `CI=true` : les warnings ESLint deviennent fatal — force à ne pas
          # laisser passer un bundle avec des variables inutilisées, imports
          # cassés, etc. C'est ce qui a masqué que le vieux bundle traînait.
          CI=true yarn build

      - name: Sync Capacitor iOS
        script: |
          cd frontend
          # Ordre strict imposé par le brief : yarn install → CI=true yarn build
          # → npx cap sync ios → xcodebuild. `cap sync` copie build/ vers
          # ios/App/App/public/ (public/ est gitignoré, jamais commit).
          npx cap sync ios

      - name: Sanity — cap sync a bien écrasé public/
        script: |
          cd frontend
          SRC=$(md5sum build/index.html | cut -d' ' -f1)
          DST=$(md5sum ios/App/App/public/index.html | cut -d' ' -f1)
          echo "build/index.html         md5=$SRC"
          echo "ios/public/index.html    md5=$DST"
          if [ "$SRC" != "$DST" ]; then
            echo "❌ ios/public/index.html différent de build/index.html — cap sync a échoué"
            exit 1
          fi
          echo "✅ Bundle web synchronisé (md5 identique)"
          # Vérifie que l'estampille est bien inlinée dans les JS
          if grep -R "$BUILD_STAMP" ios/App/App/public/static/js/ >/dev/null 2>&1; then
            echo "✅ Estampille $BUILD_STAMP présente dans le bundle JS"
          else
            echo "⚠️  Estampille $BUILD_STAMP absente du bundle JS (à vérifier)"
          fi

      - name: Patch pbxproj (CURRENT_PROJECT_VERSION = $BUILD_NUMBER)
        script: |
          cd frontend/ios/App
          # Info.plist utilise $(CURRENT_PROJECT_VERSION) et $(MARKETING_VERSION)
          # → xcodebuild lit la valeur du pbxproj, pas d'Info.plist. Sans ce
          # patch, la valeur hardcodée du pbxproj (79) écrasait le PlistBuddy
          # → régression 78 → 69 en TestFlight.
          PBX="App.xcodeproj/project.pbxproj"
          cp "$PBX" "$PBX.bak"
          sed -i.tmp -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$PBX"
          rm -f "$PBX.tmp"
          echo "--- valeurs après patch (attendues : ${BUILD_NUMBER}) ---"
          grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION" "$PBX" | sort -u
          # Fail si une valeur ≠ BUILD_NUMBER reste
          if grep -E "CURRENT_PROJECT_VERSION = [0-9]+;" "$PBX" | grep -v "= ${BUILD_NUMBER};" ; then
            echo "❌ Il reste une CURRENT_PROJECT_VERSION ≠ ${BUILD_NUMBER} dans pbxproj"
            exit 1
          fi

      - name: CocoaPods install
        script: |
          cd frontend/ios/App
          pod install --repo-update

      - name: iOS code signing setup
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --workspace "App.xcworkspace" \
            --scheme "App" \
            --archive-flags="-destination 'generic/platform=iOS'"

      - name: Android keystore setup
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo $CM_KEYSTORE | base64 --decode > /tmp/kolo-keystore.jks
            cat >> "$CM_BUILD_DIR/frontend/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/kolo-keystore.jks
          EOF
          fi || true

      - name: Sync Capacitor Android
        script: |
          cd frontend
          npx cap sync android || true

      - name: Build Android AAB
        script: |
          if [ -d frontend/android ]; then
            cd frontend/android
            ./gradlew bundleRelease || true
          fi

      - name: Build Android APK
        script: |
          if [ -d frontend/android ]; then
            cd frontend/android
            ./gradlew assembleRelease || true
          fi

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - frontend/build.log

    publishing:
      email:
        recipients:
          - contact@trykolo.io
        notify:
          success: true
          failure: true

      app_store_connect:
        # Utilise l'intégration "KOLO 1" configurée dans Codemagic
        # → Teams → Integrations → App Store Connect → KOLO 1
        auth: integration
        submit_to_testflight: true
