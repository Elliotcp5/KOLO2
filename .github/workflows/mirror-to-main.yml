name: Mirror to main + Trigger Codemagic

# Objectif final : régler définitivement le circuit Emergent → GitHub → Codemagic.
#
# Flow :
#   1. Emergent push sur une branche (emergent/xxx, feature/xxx, ...)
#   2. Ce workflow force-push le SHA sur `main`
#   3. Ce workflow appelle l'API Codemagic pour lancer un build sur `main`
#      (bypass complet du webhook GitHub → Codemagic qui peut être cassé)
#
# Secrets requis (à ajouter dans GitHub → Settings → Secrets → Actions) :
#   - CODEMAGIC_API_TOKEN : personal access token depuis
#     https://codemagic.io/settings/personal-account/integrations
#   - CM_APP_ID : ID de l'app Codemagic (dans l'URL du projet Codemagic,
#     ex: https://codemagic.io/app/6XXXXXXXXX/...)
#
# Skip possible : `[skip mirror]` dans le message de commit.

on:
  push:
    branches-ignore:
      - main
      - master

concurrency:
  group: mirror-to-main
  cancel-in-progress: false

jobs:
  mirror-and-trigger:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip mirror]')"
    permissions:
      contents: write
    steps:
      - name: Checkout la branche poussée
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Configure git
        run: |
          git config user.name  "emergent-mirror[bot]"
          git config user.email "emergent-mirror@users.noreply.github.com"

      - name: Force-push vers main
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_REF: ${{ github.ref }}
        run: |
          echo "Mirror ${SRC_REF} (${SRC_SHA:0:7}) → main"
          git push --force origin "${SRC_SHA}:refs/heads/main"

      - name: Trigger Codemagic build via API
        if: env.CODEMAGIC_API_TOKEN != '' && env.CM_APP_ID != ''
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CM_APP_ID: ${{ secrets.CM_APP_ID }}
          SRC_SHA: ${{ github.sha }}
        run: |
          echo "Trigger Codemagic build on main (SHA ${SRC_SHA:0:7})"
          RESPONSE=$(curl -sS -X POST "https://api.codemagic.io/builds" \
            -H "Content-Type: application/json" \
            -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
            -d "{\"appId\": \"$CM_APP_ID\", \"workflowId\": \"kolo-ios-android\", \"branch\": \"main\"}")
          echo "Codemagic response: $RESPONSE"
          BUILD_ID=$(echo "$RESPONSE" | grep -o '"buildId":"[^"]*"' | cut -d'"' -f4)
          if [ -n "$BUILD_ID" ]; then
            echo "✅ Codemagic build lancé : https://codemagic.io/app/$CM_APP_ID/build/$BUILD_ID"
          else
            echo "⚠️  Réponse Codemagic inattendue — vérifie CODEMAGIC_API_TOKEN et CM_APP_ID"
            exit 1
          fi

      - name: Secrets absents — message d'aide
        if: env.CODEMAGIC_API_TOKEN == '' || env.CM_APP_ID == ''
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CM_APP_ID: ${{ secrets.CM_APP_ID }}
        run: |
          echo "⚠️  Les secrets CODEMAGIC_API_TOKEN et/ou CM_APP_ID ne sont pas configurés."
          echo ""
          echo "→ main est bien à jour, mais Codemagic ne sera pas déclenché automatiquement."
          echo ""
          echo "Pour activer le trigger auto :"
          echo "  1. https://codemagic.io/settings/personal-account/integrations → générer un token"
          echo "  2. URL du projet Codemagic : le nombre après /app/ est ton CM_APP_ID"
          echo "  3. GitHub → Settings → Secrets and variables → Actions → New repository secret :"
          echo "     - CODEMAGIC_API_TOKEN = <ton token>"
          echo "     - CM_APP_ID = <l'ID app Codemagic>"
